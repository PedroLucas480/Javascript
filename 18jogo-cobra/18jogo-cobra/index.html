<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Serpente</title>
  <style>

    @font-face{
      font-family: 'MinhaFonte';
      src: url(aerosoldier/AerosoldierBasicSymbol_PERSONAL_USE_ONLY.otf) format(Opentype);
      font-weight: normal;
      font-style: normal;
    }

    /* Fundo em gradiente suave */
    body {
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: url(RJ.jpg) no-repeat;
      overflow: hidden;
      color: #ff3300;
      font-family: 'MinhaFonte';
      margin: 0;
    }

    h1 {
      font-size: 2em;
      color: #ffffff;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.2);
      margin-bottom: 20px;
    }

    canvas {
      border: 3px solid #003102;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
      background-color: #89db8b;
      border-radius: 8px;
    }

    input {
      margin-top: 20px;
      padding: 12px 24px;
      background-color: #66bb6a;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1em;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease;
      font-family: 'MinhaFonte';
    }

    input:hover {
      background-color: #fdfffd00;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <h1> JOGO DA SERPENTE </h1>
  <canvas id="snake" width="800" height="800"></canvas>
  <script src="scripts.js"></script>
  <input type="button" value=" REINICIAR" onClick="window.location.reload()">
</body>
</html>
